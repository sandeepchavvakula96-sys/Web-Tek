<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic HTML Webpage: Headings, Paragraphs and Line Breaks</title>

    <style>

        /* ---------- BASIC RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ---------- BODY ---------- */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #fce7f3, transparent 35%),
                linear-gradient(135deg, #f8fafc, #eef2ff);

            color: #1e293b;

            display: flex;
            flex-direction: column;
        }

        /* ---------- CONTAINER ---------- */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        /* ---------- NAVIGATION ---------- */
        .site-nav {
            background: linear-gradient(90deg, #1e1b4b, #312e81, #4c1d95);
            padding: 18px 0;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-nav a {
            color: white;
            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            padding: 10px 18px;
            border-radius: 25px;

            transition: 0.3s;
        }

        .site-nav a:hover {
            background: #a855f7;
            transform: translateY(-3px);

            box-shadow: 0 6px 18px rgba(168, 85, 247, 0.5);
        }

        /* ---------- MAIN SECTION ---------- */
        main {
            flex: 1;
            padding: 50px 0;
        }

        /* ---------- PROGRAM HEADER ---------- */
        .program-head {
            text-align: center;
            margin-bottom: 35px;

            animation: fadeDown 0.8s ease;
        }

        /* ---------- BADGE ---------- */
        .badge {
            display: inline-block;

            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;

            padding: 8px 18px;
            border-radius: 25px;

            font-size: 14px;
            font-weight: bold;

            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);

            margin-bottom: 15px;

            transition: 0.3s;
        }

        .badge:hover {
            transform: scale(1.08) rotate(-2deg);
        }

        /* ---------- MAIN TITLE ---------- */
        .program-head h1 {
            font-size: 40px;
            line-height: 1.2;

            background: linear-gradient(
                90deg,
                #4f46e5,
                #9333ea,
                #db2777
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 12px;
        }

        /* ---------- DESCRIPTION ---------- */
        .muted {
            color: #64748b;
            font-size: 17px;
        }

        /* ---------- DEMO BOX ---------- */
        .demo {
            max-width: 850px;
            margin: 0 auto;

            background: rgba(255, 255, 255, 0.9);

            padding: 40px;

            border-radius: 20px;

            border: 1px solid rgba(148, 163, 184, 0.3);

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.12);

            animation: fadeUp 0.9s ease;

            transition: 0.3s;
        }

        .demo:hover {
            transform: translateY(-5px);

            box-shadow:
                0 20px 50px rgba(79, 70, 229, 0.18);
        }

        /* ---------- DEMO HEADING 1 ---------- */
        .demo h1 {
            font-size: 34px;

            color: #4338ca;

            margin-bottom: 15px;

            border-left: 6px solid #6366f1;

            padding-left: 15px;

            transition: 0.3s;
        }

        .demo h1:hover {
            color: #9333ea;
            padding-left: 22px;
        }

        /* ---------- DEMO HEADING 2 ---------- */
        .demo h2 {
            font-size: 26px;

            color: #7c3aed;

            margin: 20px 0 12px;
        }

        /* ---------- PARAGRAPHS ---------- */
        .demo p {
            font-size: 18px;

            line-height: 1.8;

            color: #475569;

            margin-bottom: 18px;

            padding: 15px;

            background: #f8fafc;

            border-radius: 12px;

            border-left: 4px solid #a855f7;

            transition: 0.3s;
        }

        .demo p:hover {
            background: #f3e8ff;

            transform: translateX(6px);

            border-left-color: #6366f1;
        }

        /* ---------- FOOTER ---------- */
        footer {
            background: linear-gradient(
                90deg,
                #1e1b4b,
                #312e81,
                #4c1d95
            );

            color: #e2e8f0;

            text-align: center;

            padding: 22px;

            font-size: 14px;

            letter-spacing: 0.5px;
        }

        /* ---------- ANIMATIONS ---------- */

        @keyframes fadeDown {

            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* ---------- MOBILE ---------- */

        @media (max-width: 768px) {

            .nav-inner {
                flex-direction: column;
                gap: 10px;
            }

            .program-head h1 {
                font-size: 30px;
            }

            .demo {
                padding: 25px;
            }

            .demo h1 {
                font-size: 28px;
            }

            .demo h2 {
                font-size: 23px;
            }

            .demo p {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {

            .program-head h1 {
                font-size: 25px;
            }

            .site-nav a {
                font-size: 14px;
                padding: 8px 12px;
            }

            .demo {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="site-nav">

        <div class="container nav-inner">

            <a href="../index.html">🏠 Home</a>

            <a href="index.html">⬅ Back to Programs</a>

        </div>

    </nav>


    <!-- MAIN CONTENT -->
    <main class="container">

        <div class="program-head">

            <span class="badge">HTML 01</span>

            <h1>
                Basic HTML Webpage:
                Headings, Paragraphs and Line Breaks
            </h1>

            <p class="muted">
                HTML practical experiment.
            </p>

        </div>


        <!-- DEMONSTRATION -->
        <div class="demo">

            <h1>Main Heading</h1>

            <h2>Subheading</h2>

            <p>
                This paragraph demonstrates basic HTML text.
            </p>

            <p>
                First line<br>
                Second line<br>
                Third line
            </p>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        HTML • CSS • JavaScript Practical Programs
    </footer>

</body>

</html>
