<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frames / Iframes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #fce7f3, transparent 35%),
                linear-gradient(135deg, #eef2ff, #f8fafc);

            color: #1e1b4b;
        }

        /* Navigation */
        .site-nav {
            background: linear-gradient(
                90deg,
                #1e1b4b,
                #312e81,
                #4c1d95
            );

            padding: 16px 0;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-inner a {
            color: white;
            text-decoration: none;
            font-weight: bold;

            padding: 10px 18px;
            border-radius: 20px;

            transition: 0.3s ease;
        }

        .nav-inner a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Main */
        main {
            padding: 50px 0;
        }

        /* Heading */
        .program-head {
            text-align: center;
            margin-bottom: 35px;

            animation: fadeDown 1s ease;
        }

        .badge {
            display: inline-block;

            padding: 8px 18px;
            margin-bottom: 15px;

            border-radius: 25px;

            background: linear-gradient(
                90deg,
                #6366f1,
                #a855f7
            );

            color: white;

            font-size: 14px;
            font-weight: bold;

            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .program-head h1 {
            font-size: 40px;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #4f46e5,
                #9333ea,
                #db2777
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .muted {
            color: #64748b;
            font-size: 16px;
        }

        /* Demo */
        .demo {
            background: rgba(255, 255, 255, 0.92);

            padding: 35px;

            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(30, 27, 75, 0.15);

            animation: fadeUp 1s ease;
        }

        .demo h2 {
            color: #312e81;
            margin-bottom: 20px;
        }

        /* Iframe */
        iframe {
            width: 100%;
            height: 350px;

            border: 3px solid #6366f1;

            border-radius: 18px;

            background: white;

            box-shadow:
                0 10px 25px rgba(99, 102, 241, 0.2);

            transition: 0.3s ease;
        }

        iframe:hover {
            border-color: #a855f7;

            transform: scale(1.01);

            box-shadow:
                0 15px 35px rgba(168, 85, 247, 0.25);
        }

        /* Footer */
        footer {
            text-align: center;

            background: linear-gradient(
                90deg,
                #1e1b4b,
                #312e81,
                #4c1d95
            );

            color: white;

            padding: 20px;

            margin-top: 30px;
        }

        /* Animations */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            .nav-inner {
                flex-direction: column;
                gap: 10px;
            }

            .program-head h1 {
                font-size: 30px;
            }

            .demo {
                padding: 20px;
            }

            iframe {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="site-nav">
        <div class="container nav-inner">

            <a href="../index.html">Home</a>

            <a href="index.html">Back to Programs</a>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="container">

        <div class="program-head">

            <span class="badge">HTML 07</span>

            <h1>Frames / Iframes</h1>

            <p class="muted">
                HTML practical experiment demonstrating iframe usage.
            </p>

        </div>


        <!-- Iframe Example -->
        <div class="demo">

            <h2>Iframe Example</h2>

            <iframe
                title="Student Web Development Example"
                srcdoc="
                <!DOCTYPE html>
                <html>
                <head>
                    <style>

                        body {
                            font-family: Arial, sans-serif;
                            background: linear-gradient(135deg, #eef2ff, #fce7f3);
                            padding: 30px;
                            text-align: center;
                            color: #1e1b4b;
                        }

                        .card {
                            background: white;
                            padding: 25px;
                            border-radius: 18px;
                            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
                            max-width: 500px;
                            margin: auto;
                        }

                        h2 {
                            color: #4f46e5;
                            margin-bottom: 10px;
                        }

                        p {
                            color: #475569;
                            line-height: 1.6;
                        }

                        ul {
                            text-align: left;
                            line-height: 2;
                            color: #334155;
                        }

                        button {
                            background: linear-gradient(90deg, #6366f1, #a855f7);
                            color: white;
                            border: none;
                            padding: 12px 25px;
                            border-radius: 25px;
                            cursor: pointer;
                            font-weight: bold;
                        }

                        button:hover {
                            transform: scale(1.05);
                        }

                    </style>
                </head>

                <body>

                    <div class='card'>

                        <h2>Welcome to My Web Page</h2>

                        <p>
                            This webpage is displayed inside an
                            <b>iframe</b>.
                        </p>

                        <p>
                            Iframes allow one HTML document to be
                            displayed inside another HTML document.
                        </p>

                        <h3>Web Technologies</h3>

                        <ul>
                            <li>HTML - Structure</li>
                            <li>CSS - Styling</li>
                            <li>JavaScript - Functionality</li>
                        </ul>

                        <button onclick='alert(&quot;Welcome to the iframe example!&quot;)'>
                            Click Me
                        </button>

                    </div>

                </body>
                </html>
                ">
            </iframe>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        HTML • CSS • JavaScript Practical Programs
    </footer>

</body>

</html>
