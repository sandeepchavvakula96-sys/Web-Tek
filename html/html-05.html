<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>

        /* ---------- RESET ---------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ---------- BODY ---------- */

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #fce7f3, transparent 35%),
                linear-gradient(135deg, #f8fafc, #eef2ff);

            color: #1e293b;

            display: flex;
            flex-direction: column;
        }


        /* ---------- CONTAINER ---------- */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }


        /* ---------- NAVIGATION ---------- */

        .site-nav {
            background: linear-gradient(
                90deg,
                #1e1b4b,
                #312e81,
                #4c1d95
            );

            padding: 18px 0;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.2);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-nav a {
            color: white;
            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            padding: 10px 18px;

            border-radius: 25px;

            transition: 0.3s;
        }

        .site-nav a:hover {
            background: #a855f7;

            transform: translateY(-3px);

            box-shadow:
                0 6px 18px rgba(168, 85, 247, 0.5);
        }


        /* ---------- MAIN ---------- */

        main {
            flex: 1;

            padding: 50px 0;
        }


        /* ---------- HEADER ---------- */

        .program-head {
            text-align: center;

            margin-bottom: 35px;

            animation: fadeDown 0.8s ease;
        }


        /* ---------- BADGE ---------- */

        .badge {
            display: inline-block;

            background: linear-gradient(
                135deg,
                #6366f1,
                #a855f7
            );

            color: white;

            padding: 8px 18px;

            border-radius: 25px;

            font-size: 14px;
            font-weight: bold;

            margin-bottom: 15px;

            box-shadow:
                0 6px 15px rgba(99, 102, 241, 0.3);

            transition: 0.3s;
        }

        .badge:hover {
            transform: scale(1.08) rotate(-2deg);
        }


        /* ---------- TITLE ---------- */

        .program-head h1 {
            font-size: 40px;

            line-height: 1.2;

            background: linear-gradient(
                90deg,
                #4f46e5,
                #9333ea,
                #db2777
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 12px;
        }


        /* ---------- SUBTITLE ---------- */

        .muted {
            color: #64748b;

            font-size: 17px;
        }


        /* ---------- DEMO BOX ---------- */

        .demo {
            max-width: 650px;

            margin: 0 auto;

            background: rgba(255, 255, 255, 0.92);

            padding: 40px;

            border-radius: 22px;

            border: 1px solid rgba(148, 163, 184, 0.3);

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.12);

            animation: fadeUp 0.9s ease;

            transition: 0.3s;
        }

        .demo:hover {
            transform: translateY(-5px);

            box-shadow:
                0 20px 50px rgba(79, 70, 229, 0.18);
        }


        /* ---------- FORM ---------- */

        form {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        /* ---------- INPUTS ---------- */

        input,
        select {
            width: 100%;

            padding: 15px 18px;

            font-size: 16px;

            font-family: inherit;

            color: #334155;

            background: #f8fafc;

            border: 2px solid #e2e8f0;

            border-radius: 12px;

            outline: none;

            transition: 0.3s;
        }


        /* ---------- INPUT FOCUS ---------- */

        input:focus,
        select:focus {
            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);

            transform: translateY(-2px);
        }


        /* ---------- PLACEHOLDER ---------- */

        input::placeholder {
            color: #94a3b8;
        }


        /* ---------- SELECT ---------- */

        select {
            cursor: pointer;
        }


        /* ---------- BUTTON ---------- */

        .btn {
            border: none;

            padding: 15px;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #9333ea
            );

            color: white;

            font-size: 17px;

            font-weight: 700;

            font-family: inherit;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(79, 70, 229, 0.3);

            transition: 0.3s;
        }


        /* ---------- BUTTON HOVER ---------- */

        .btn:hover {
            transform: translateY(-4px);

            background: linear-gradient(
                135deg,
                #9333ea,
                #db2777
            );

            box-shadow:
                0 12px 28px rgba(147, 51, 234, 0.4);
        }


        /* ---------- BUTTON CLICK ---------- */

        .btn:active {
            transform: scale(0.97);
        }


        /* ---------- RESULT ---------- */

        .result {
            margin-top: 25px;

            padding: 15px;

            text-align: center;

            border-radius: 12px;

            background: #ecfdf5;

            color: #047857;

            font-size: 16px;

            font-weight: 600;

            border: 1px solid #a7f3d0;

            min-height: 0;

            transition: 0.3s;
        }


        /* ---------- FOOTER ---------- */

        footer {
            background: linear-gradient(
                90deg,
                #1e1b4b,
                #312e81,
                #4c1d95
            );

            color: #e2e8f0;

            text-align: center;

            padding: 22px;

            font-size: 14px;

            letter-spacing: 0.5px;
        }


        /* ---------- ANIMATIONS ---------- */

        @keyframes fadeDown {

            from {
                opacity: 0;

                transform:
                    translateY(-30px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes fadeUp {

            from {
                opacity: 0;

                transform:
                    translateY(30px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* ---------- TABLET ---------- */

        @media (max-width: 768px) {

            .nav-inner {
                flex-direction: column;

                gap: 10px;
            }

            .program-head h1 {
                font-size: 30px;
            }

            .demo {
                padding: 25px;
            }
        }


        /* ---------- MOBILE ---------- */

        @media (max-width: 480px) {

            .program-head h1 {
                font-size: 25px;
            }

            .site-nav a {
                font-size: 14px;

                padding: 8px 12px;
            }

            .demo {
                padding: 20px;
            }

            input,
            select,
            .btn {
                font-size: 15px;

                padding: 13px;
            }
        }

    </style>

</head>

<body>


    <!-- NAVIGATION -->

    <nav class="site-nav">

        <div class="container nav-inner">

            <a href="../index.html">
                🏠 Home
            </a>

            <a href="index.html">
                ⬅ Back to Programs
            </a>

        </div>

    </nav>


    <!-- MAIN CONTENT -->

    <main class="container">

        <div class="program-head">

            <span class="badge">
                HTML 05
            </span>

            <h1>
                Student Registration Form
            </h1>

            <p class="muted">
                HTML practical experiment.
            </p>

        </div>


        <!-- REGISTRATION FORM -->

        <div class="demo">

            <form
                onsubmit="
                    event.preventDefault();
                    r.textContent='Registration submitted successfully.';
                "
            >

                <input
                    required
                    type="text"
                    placeholder="Full Name"
                >

                <input
                    required
                    type="email"
                    placeholder="Email"
                >

                <input
                    required
                    type="date"
                >

                <select required>

                    <option value="">
                        Choose course
                    </option>

                    <option>
                        BCA
                    </option>

                    <option>
                        BSc
                    </option>

                </select>

                <button
                    type="submit"
                    class="btn"
                >
                    📝 Register
                </button>

            </form>


            <!-- RESULT -->

            <div
                id="r"
                class="result"
            ></div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>
        HTML • CSS • JavaScript Practical Programs
    </footer>

</body>

</html>
