<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML5 Input Types</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #fce7f3, transparent 35%),
                linear-gradient(135deg, #eef2ff, #f8fafc);

            color: #1e1b4b;
        }

        /* Navigation */
        .site-nav {
            background: linear-gradient(
                90deg,
                #1e1b4b,
                #312e81,
                #4c1d95
            );

            padding: 16px 0;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-inner a {
            color: white;
            text-decoration: none;
            font-weight: bold;

            padding: 10px 18px;
            border-radius: 20px;

            transition: 0.3s ease;
        }

        .nav-inner a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Main */
        main {
            padding: 50px 0;
        }

        /* Program Heading */
        .program-head {
            text-align: center;
            margin-bottom: 35px;

            animation: fadeDown 1s ease;
        }

        .badge {
            display: inline-block;

            padding: 8px 18px;
            margin-bottom: 15px;

            border-radius: 25px;

            background: linear-gradient(
                90deg,
                #6366f1,
                #a855f7
            );

            color: white;

            font-size: 14px;
            font-weight: bold;

            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        .program-head h1 {
            font-size: 40px;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #4f46e5,
                #9333ea,
                #db2777
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .muted {
            color: #64748b;
            font-size: 16px;
        }

        /* Demo Card */
        .demo {
            background: rgba(255, 255, 255, 0.92);

            padding: 35px;

            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(30, 27, 75, 0.15);

            animation: fadeUp 1s ease;

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .demo::before {
            content: "Try Different HTML5 Input Types";

            color: #312e81;

            font-size: 22px;
            font-weight: bold;

            margin-bottom: 5px;
        }

        /* Input Styling */
        .demo input {
            width: 100%;

            padding: 15px 18px;

            border: 2px solid #c7d2fe;

            border-radius: 12px;

            background: #f8fafc;

            color: #1e1b4b;

            font-size: 16px;

            outline: none;

            transition: 0.3s ease;
        }

        /* Placeholder */
        .demo input::placeholder {
            color: #94a3b8;
        }

        /* Focus Effect */
        .demo input:focus {
            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);

            transform: translateY(-2px);
        }

        /* Hover Effect */
        .demo input:hover {
            border-color: #8b5cf6;
        }

        /* Date Input */
        .demo input[type="date"] {
            color: #475569;
        }

        /* Number Input */
        .demo input[type="number"] {
            appearance: textfield;
        }

        /* Password Input */
        .demo input[type="password"] {
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        body > footer {
            background: linear-gradient(
                90deg,
                #1e1b4b,
                #312e81,
                #4c1d95
            );

            color: white;

            text-align: center;

            padding: 20px;

            margin-top: 30px;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {

            .nav-inner {
                flex-direction: column;
                gap: 10px;
            }

            .program-head h1 {
                font-size: 30px;
            }

            .demo {
                padding: 20px;
            }

            .demo input {
                font-size: 15px;
            }

            main {
                padding: 30px 0;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="site-nav">

        <div class="container nav-inner">

            <a href="../index.html">Home</a>

            <a href="index.html">Back to Programs</a>

        </div>

    </nav>


    <!-- Main Content -->
    <main class="container">

        <div class="program-head">

            <span class="badge">HTML 09</span>

            <h1>HTML5 Input Types</h1>

            <p class="muted">
                HTML practical experiment demonstrating different
                HTML5 input types.
            </p>

        </div>


        <!-- Input Demo -->
        <div class="demo">

            <!-- Email -->
            <input
                type="email"
                placeholder="Enter your Email">

            <!-- Date -->
            <input
                type="date">

            <!-- Number -->
            <input
                type="number"
                placeholder="Enter your Age"
                min="1"
                max="100">

            <!-- Password -->
            <input
                type="password"
                placeholder="Enter your Password">

        </div>

    </main>


    <!-- Footer -->
    <footer>
        HTML • CSS • JavaScript Practical Programs
    </footer>

</body>

</html>
